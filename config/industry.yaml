# Industry structure: segments, external demand/supply nodes, supply-chain links
# and the queries used to collect industry-wide news.
#
# Links read "source supplies target". Demand flows the opposite way:
# enterprise AI adoption -> hyperscaler capex -> AI servers -> chips & components.

segments:
  foundry:
    label: Foundry & Advanced Packaging
    group: AI Chips & Foundry
    keywords: [TSMC, foundry, CoWoS, wafer, advanced packaging, 晶圓, 先進封裝, 台積]
  server_silicon:
    label: Server Management Chips
    group: AI Chips & Foundry
    keywords: [BMC, server shipments, 伺服器出貨, 遠端管理晶片]
  server_odm:
    label: AI Server Assembly (ODM)
    group: AI Servers
    keywords: [AI server, server rack, ODM, GB200, GB300, Vera Rubin, AI 伺服器, 伺服器, 機櫃]
  power_thermal:
    label: Power & Thermal
    group: Datacenter Infrastructure
    keywords: [power supply, liquid cooling, thermal, cooling, power shelf, 散熱, 液冷, 電源]
  networking:
    label: Datacenter Networking
    group: Datacenter Infrastructure
    keywords: [data center switch, networking, 800G, 1.6T, Ethernet, 交換器]
  materials:
    label: PCB Materials & Substrates
    group: Materials
    keywords: [CCL, PCB, substrate, ABF, copper clad, 載板, 銅箔基板, 印刷電路板]
  ai_platform:
    label: Operational AI Platform
    group: Enterprise AI Software
    keywords: [AI platform, defense AI, government AI, enterprise AI adoption]
  chip_design_software:
    label: Chip Design Software (EDA)
    group: AI Infrastructure Software
    keywords: [EDA, chip design software, electronic design automation]
  edge_network:
    label: Edge Network & Inference
    group: AI Infrastructure Software
    keywords: [edge computing, AI inference, AI crawler, CDN]
  ai_observability:
    label: AI Observability
    group: AI Infrastructure Software
    keywords: [observability, cloud monitoring, LLM monitoring]
  ai_security:
    label: AI-Native Security
    group: Security & Data Resilience
    keywords: [cybersecurity, endpoint security, security breach, 資安]
  data_security:
    label: Cyber Resilience
    group: Security & Data Resilience
    keywords: [ransomware, data backup, cyber resilience, data security]
  physical_ops_ai:
    label: Physical Operations AI
    group: Vertical AI Software
    keywords: [fleet management, telematics, industrial IoT]
  healthcare_ai:
    label: Precision Medicine AI
    group: Vertical AI Software
    keywords: [precision medicine, genomic testing, oncology AI, AI diagnostics]
  scientific_ai:
    label: Molecular Design AI
    group: Vertical AI Software
    keywords: [computational drug discovery, molecular simulation, AI drug discovery]
  life_sciences_cloud:
    label: Life Sciences Cloud
    group: Vertical AI Software
    keywords: [life sciences software, pharma CRM, clinical trial software]

external_nodes:
  - id: hyperscalers
    label: Hyperscalers & AI clouds
    detail: Microsoft, Google, Amazon, Meta, Oracle, CoreWeave — their AI capex is the main demand signal for the hardware chain.
  - id: accelerators
    label: AI accelerator designers
    detail: NVIDIA, AMD, Broadcom and hyperscaler custom ASIC teams.
  - id: enterprises
    label: Enterprises & governments adopting AI
    detail: The end demand whose AI spending justifies cloud capex.
  - id: life_sciences
    label: Pharma, biotech & healthcare
    detail: R&D and clinical budgets drive vertical AI software demand.

# Words that mark an article as broad AI-infrastructure news (used by the keyword heuristic).
general_ai_infra_keywords: [AI capex, data center, datacenter, hyperscaler, AI demand, AI spending, AI bubble, 資料中心, AI需求, AI 需求]

