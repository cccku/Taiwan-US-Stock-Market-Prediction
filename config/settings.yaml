# AI Stock Radar — runtime settings.
# Every key is optional; defaults live in backend/config.py.

server:
  host: 127.0.0.1        # local only
  port: 8765

refresh:
  interval_seconds: 300          # auto-refresh while the app is open (5 min)
  min_gap_seconds: 45            # ignore refresh requests that arrive closer than this
  fundamentals_ttl_hours: 6      # valuation data (P/E, analyst targets) changes slowly

news:
  lookback_days: 30              # news older than this no longer affects predictions
  max_new_articles_per_stock: 12 # cap per refresh so the first run stays reasonable
  max_new_industry_articles: 20
  providers: [google_news, yahoo_finance]
  request_timeout_seconds: 15
  max_workers: 4

analysis:
  # auto      = Claude when credentials exist (ANTHROPIC_API_KEY or config/.env), keyword heuristic otherwise
  # llm       = Claude only (articles wait unanalyzed if the API is unavailable)
  # heuristic = keyword heuristic only (free, low confidence)
  engine: auto
  model: claude-opus-5
  effort: high                   # low | medium | high | xhigh | max
  use_fallbacks: true            # server-side refusal fallback
  batch_size: 10                 # articles per Claude request
  max_workers: 4
  request_timeout_seconds: 300

prediction:
  horizon_days: 90               # the predicted price is a ~3-month fair-value estimate
  half_life_days:                # how fast a news item's influence fades
    transient: 5
    medium: 21
    structural: 90
  positive_cap: 0.40             # stacked good news saturates at +40%
  negative_cap: 0.85             # bad news can take the estimate down to -85%
  valuation_weight: 0            # >0 pulls toward analyst consensus target (e.g. 0.25); 0 = news only
  valuation_cap: 0.15
  neutral_band: 0.01             # |expected move| below 1% is shown as "neutral"
